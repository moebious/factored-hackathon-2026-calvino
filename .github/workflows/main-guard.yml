# Alarm for the "main only changes through pull requests" rule in AGENTS.md.
# Local hooks can be bypassed (--no-verify) and branch protection is a
# repository setting, so this check marks main red if a pushed commit is not
# the result of a merged pull request.
name: main-guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  main-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check every pushed commit came from a merged pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # The commits in this push, oldest first (just the head on a new branch).
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            shas="$AFTER"
          else
            shas=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.commits[].sha')
          fi
          # GitHub links a commit to its pull request a few seconds after the merge, so a
          # commit with no merged pull request is asked about again before it counts as a
          # bypass: up to 6 attempts, 10 seconds apart. A real bypass still fails, about a
          # minute later.
          merged_prs() {
            gh api "repos/$REPO/commits/$1/pulls" --jq '[.[] | select(.merged_at != null)] | length'
          }
          fail=0
          for sha in $shas; do
            attempt=1
            merged=$(merged_prs "$sha")
            while [ "$merged" -eq 0 ] && [ "$attempt" -lt 6 ]; do
              sleep 10
              attempt=$((attempt + 1))
              merged=$(merged_prs "$sha")
            done
            if [ "$merged" -eq 0 ]; then
              echo "::error::Commit $sha reached main without a merged pull request"
              fail=1
            fi
          done
          exit "$fail"
