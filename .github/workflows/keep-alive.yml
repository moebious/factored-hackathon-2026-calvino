# Keep the demo Space awake (TSD-003): a Hugging Face Space sleeps after
# inactivity, and waking it costs a cold start even with baked weights. A
# scheduled ping every 30 minutes keeps the container and its preloaded Laya
# warm during the demo window. The public URL is a repository variable
# (Settings -> Secrets and variables -> Actions -> Variables), never
# hard-coded, so the workflow works for any Space name.

name: keep-alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the public demo URL
        env:
          URL: ${{ vars.CALVINO_PUBLIC_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "CALVINO_PUBLIC_URL is not set; nothing to ping yet."
            exit 0
          fi
          # No --fail: a Space that is waking up answers 5xx briefly, and the
          # ping's job is to wake it, not to turn CI red while it does.
          code=$(curl --silent --show-error --max-time 120 --output /dev/null \
            --write-out "%{http_code}" "$URL/health" || echo "000")
          echo "GET $URL/health -> $code"
