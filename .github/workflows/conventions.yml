# Enforces the git workflow rules in AGENTS.md on every pull request, using
# the same script as the local commit-msg hook: Conventional Commits for the
# PR title (it becomes the squash commit on main) and every commit, only
# the scoped Factory trailer in docs-only commits, no attribution in PR text,
# and no commit too
# large to review.
name: conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test the rule scripts
        run: bash tests/git/test_git_rules.sh

      - name: Check branch name, PR title, description and commits
        # Untrusted PR text is passed through env vars, never interpolated
        # into the script, to rule out script injection.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          check=scripts/git/check-commit-msg.sh
          fail=0

          branch_re='^(feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)/[a-z0-9][a-z0-9._-]*$'
          if ! printf '%s' "$HEAD_REF" | grep -qE "$branch_re"; then
            echo "error: branch '$HEAD_REF' does not match <type>/<short-description> (see AGENTS.md)"; fail=1
          fi

          echo "PR title: $PR_TITLE"
          printf '%s\n' "$PR_TITLE" | "$check" - || fail=1
          printf '%s\n' "$PR_BODY" | "$check" --no-subject - || { echo "  in: PR description"; fail=1; }

          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            message_file=$(mktemp)
            git log -1 --format=%B "$sha" > "$message_file"
            scope=$(git diff-tree --no-commit-id --name-only -r "$sha" | bash scripts/git/attribution-scope.sh "$message_file")
            if [ "$scope" = docs ] || [ "$scope" = bootstrap ]; then
              "$check" "--scope=$scope" "$message_file" || { echo "  in: commit $(git rev-parse --short "$sha")"; fail=1; }
            else
              "$check" "$message_file" || { echo "  in: commit $(git rev-parse --short "$sha")"; fail=1; }
            fi
            rm -f "$message_file"
          done

          exit "$fail"

      - name: Check commit sizes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/git/check-commit-size.sh "$BASE_SHA..$HEAD_SHA"
