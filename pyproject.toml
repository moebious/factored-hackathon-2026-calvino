# Project configuration for the Calvino Python package (src layout, managed with uv).
[project]
name = "calvino"
version = "0.1.0"
description = "Calvino: a domain-specific harness for AI-first banking customer service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.15.1",
    "mcp>=2.2.0",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calvino"]

[tool.pytest.ini_options]
testpaths = ["tests/calvino"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
