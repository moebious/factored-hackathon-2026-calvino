# Calvino policy v3 (TSD-026): v2 with the route rebuilt on the signals that measurably separate
# the classes. v1 and v2 stay on disk unchanged; decisions logged under them replay under them.
#
# What the exploratory measurement showed [measured, 110 team-written rows, live laya 0.3.26]:
# the needs_human score does not separate "needs a person" from routine requests (AUROC 0.49),
# and under v2 not one of 64 routine rows reached the agent; four gates blocked them: needs_human
# (19), the clear_enough gate (P(clear) is 0.04-0.2 for plain status messages that name no payment
# reference), the minimum-over-all-answers confidence (14-33), and dispute/fraud false positives
# (7). The signals that do separate are the workflow area (AUROC 0.72), the "talk to a person"
# intent (0.75) and injection (0.75); their max reaches 0.86.
# Changes from v2, all switches that default off in v1/v2:
#   use_needs_human: false        the score is neither required nor read (no escalate, no band)
#   talk_to_person_at: 0.50       new gate on the intent option, a human at or above
#   min_stuck_payment: 0.50       workflow area "stuck payment" below: clarify, not the agent
#   min_clear_enough: null        the clear_enough gate is off for the route (the Gate keeps its own)
#   confidence_source: workflow_area   confidence is the area answer's, not the minimum of all five
# The new thresholds are round values chosen before the confirmation run, not fitted numbers.
# Status: a candidate. Adopt only when the confirmation on unseen rows and the evaluation report
# pass the rule in docs/specs/TSD-026; the default policy stays v2 until then.
version: v3

assumptions: >
  Thresholds are hypotheses pending calibration (T-201). The route is rebuilt on the area, intent
  and injection signals because the needs_human score measured at chance on 110 team-written rows
  (exploratory, not a T-106 split); removing the needs_human, clear_enough and minimum-confidence
  gates raises the routine rows that reach the agent and lets some needs-a-person rows through
  (8 of 46 on the tuning rows), which the verifier and the Gate are the backstops for. The Gate's
  own thresholds are unchanged, so an unclear write still parks for explicit confirmation. Amount
  limits are the v2 policy assumptions (500 USD gate, 5,000 USD hard rule), illustrative, not
  derived from the data.

route:
  # Probabilities come from calibrated Laya answers; ties go to the safer side.
  escalate_at: 0.70           # unused while use_needs_human is false (kept so the file validates)
  act_below: 0.30             # unused while use_needs_human is false
  out_of_scope_at: 0.60       # workflow area "out of scope" at or above
  dispute_or_fraud_at: 0.50   # workflow area "dispute or fraud" at or above: a person handles it
  injection_at: 0.50          # injection or manipulation at or above: a person handles it
  min_clear_enough: null      # off: the clear_enough question blocked routine requests [measured]
  min_confidence: 0.60        # below: ask the customer a clarifying question
  use_needs_human: false
  talk_to_person_at: 0.50     # intent "talk to a person" at or above: a person handles it
  min_stuck_payment: 0.50     # workflow area "stuck payment" below: ask a clarifying question
  confidence_source: workflow_area

hard_rules:
  auth_failure_limit: 3       # HR-AUTH fires at this many failed authentications or more
  amount_limit:               # HR-AMOUNT fires above these amounts [policy assumption]
    MXN: 85000
    COP: 20000000
    ARS: 1750000
    USD: 5000

gate:
  allow_amount_limit:         # above these amounts an action needs a person's approval [policy assumption]
    MXN: 8500
    COP: 2000000
    ARS: 175000
    USD: 500
  min_clear_enough: 0.70      # below: ask a person instead of acting on a guess
  min_confidence: 0.60        # below: ask a person
  injection_at: 0.50          # at or above: block
  on_missing_scores: ask      # "ask" (escalate to a person) or "block" when Laya scores are absent
  eligible_statuses:          # transaction statuses each action may be applied to
    request_cancellation: [pending]
    retry_payment: [declined]
    open_investigation: [pending, declined, reversed]
