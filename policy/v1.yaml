# Calvino policy v1 (TSD-001): every threshold and limit the policy engine reads.
# This file is immutable once released: a change of any value is a new version (v2.yaml), so
# that a logged decision can be replayed under the version it was made with.
#
# Evidence labels: the thresholds are [hypothesis] until the classifier evaluation (T-201)
# calibrates them on the labelled message set; the amount limits are POLICY ASSUMPTIONS, not
# measurements. The dataset cannot ground them: claimed amounts have the same native median
# (about 2,500) in MXN, COP, ARS and USD [measured, reports/data-quality/f09].
version: v1

assumptions: >
  Thresholds are hypotheses pending calibration (T-201). Amount limits are policy assumptions
  per currency, set at 500 USD (gate) and 5,000 USD (hard rule) using round exchange rates close
  to the dataset's (about 17 MXN, 4,000 COP and 350 ARS per USD, from the implied rates in
  reports/data-quality/f09); they are illustrative, not derived from the data.

route:
  # Probabilities come from calibrated Laya answers; ties go to the safer side.
  escalate_at: 0.70           # needs_human at or above: send to a person
  act_below: 0.30             # needs_human strictly below: the agent path may act
  out_of_scope_at: 0.60       # workflow area "out of scope" at or above
  dispute_or_fraud_at: 0.50   # workflow area "dispute or fraud" at or above: a person handles it
  injection_at: 0.50          # injection or manipulation at or above: a person handles it
  min_clear_enough: 0.50      # below: ask the customer a clarifying question
  min_confidence: 0.60        # below: ask the customer a clarifying question

hard_rules:
  auth_failure_limit: 3       # HR-AUTH fires at this many failed authentications or more
  amount_limit:               # HR-AMOUNT fires above these amounts [policy assumption]
    MXN: 85000
    COP: 20000000
    ARS: 1750000
    USD: 5000

gate:
  allow_amount_limit:         # above these amounts an action needs a person's approval [policy assumption]
    MXN: 8500
    COP: 2000000
    ARS: 175000
    USD: 500
  min_clear_enough: 0.70      # below: ask a person instead of acting on a guess
  min_confidence: 0.60        # below: ask a person
  injection_at: 0.50          # at or above: block
  on_missing_scores: ask      # "ask" (escalate to a person) or "block" when Laya scores are absent
  eligible_statuses:          # transaction statuses each action may be applied to
    request_cancellation: [pending]
    retry_payment: [declined]
    open_investigation: [pending, declined, reversed]
